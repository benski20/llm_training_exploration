name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vt-serve .
      - name: serve a certified artifact and query it
        run: |
          docker run -d --name vtsrv -p 8000:8000 -v $PWD/results/cegis/exact_dyck_L2-64:/models:ro \
            vt-serve /models/model_L16.npz /models/certificate_L16.json
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/predict -d '{"inputs": ["(()(()))()()(())"]}' | grep '"label": 1'
      - name: refuse a tampered artifact
        run: |
          mkdir t && cp results/cegis/exact_dyck_L2-64/certificate_L16.json t/
          python3 -c "import shutil; shutil.copy('results/cegis/exact_dyck_L2-64/model_L8.npz', 't/model_L16.npz')"
          ! docker run --rm -v $PWD/t:/models:ro vt-serve /models/model_L16.npz /models/certificate_L16.json
      - name: refuse a forged certificate (self-written "proved" for an unproved model)
        run: |
          mkdir f && cp results/unverified_guard_dyck16.npz f/m.npz
          python3 -c "import hashlib,json; h=hashlib.sha256(open('f/m.npz','rb').read()).hexdigest(); json.dump({'artifact_sha256':h,'status':'proved','spec':'dyck','tau':1e-4,'method':'milp'}, open('f/c.json','w'))"
          ! docker run --rm -v $PWD/f:/models:ro vt-serve /models/m.npz /models/c.json --verify-time 60
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - run: bandit -r vt                     # static analysis of the package
      - run: printf 'numpy\nscipy\n' > serve-reqs.txt && pip-audit -r serve-reqs.txt   # serving image deps
