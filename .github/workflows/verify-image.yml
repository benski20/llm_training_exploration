name: verify-image
# Builds the verification container (Dockerfile.verify) and checks it end to end with no network: calibrate on 80
# replies known to be supported (RAGTruth QA), audit 40 others, check 20 replies with labelled hallucinations,
# refuse a bad key, keep the calibration across a restart. About 10 minutes on a standard runner.
on:
  workflow_dispatch:
  push:
    paths:
      - vt/verify_engine.py
      - vt/verify_service.py
      - vt/promise.py
      - Dockerfile.verify
      - deploy/verify_smoke.py
      - examples/verify_smoke/**
      - .github/workflows/verify-image.yml
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -f Dockerfile.verify -t verify .
      - name: size
        run: docker image ls verify
      - name: run with no network and check end to end
        run: |
          KEY=$(openssl rand -hex 16)
          echo "::add-mask::$KEY"
          docker volume create verify-cal
          docker run -d --name vf --network none -e VERIFY_API_KEYS="ci:$KEY" -v verify-cal:/data \
            -v "$PWD/examples/verify_smoke:/smoke/data:ro" -v "$PWD/deploy/verify_smoke.py:/smoke/verify_smoke.py:ro" verify
          docker exec vf python /smoke/verify_smoke.py --key "$KEY" --data /smoke/data
          docker restart vf
          docker exec vf python /smoke/verify_smoke.py --key "$KEY" --data /smoke/data --after-restart
      - name: server log
        if: always()
        run: docker logs vf 2>&1 | tail -50
