name: deploy-demo
# Deploys (or stops) the VeriChat demo on Modal. GitHub's runners reach Modal's gRPC API directly.
# Credentials: repository secrets MODAL_TOKEN_ID / MODAL_TOKEN_SECRET, or the one-off inputs of a manual
# run. Inputs are read from the event file and masked before any step can print them, but they stay in
# the run's stored event data, visible to the repo's readers: rotate the token after such a run.
# Runs only when asked: manually, or when deploy/request.json changes ({"action": "deploy" | "stop"}).
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, stop, logs, wikicheck, correction]
        default: deploy
      n:
        description: questions for the correction test
        default: "100"
      modal_token_id:
        description: one-off Modal token id (rotate it afterwards); empty uses the repository secret
        required: false
      modal_token_secret:
        description: one-off Modal token secret (rotate it afterwards)
        required: false
  push:
    paths: [deploy/request.json]
permissions:
  contents: read
concurrency:
  group: modal-deploy
  cancel-in-progress: false
jobs:
  modal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: credentials (masked)
        env:
          SECRET_ID: ${{ secrets.MODAL_TOKEN_ID }}
          SECRET_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          ID=$(jq -r '.inputs.modal_token_id // empty' "$GITHUB_EVENT_PATH")
          SEC=$(jq -r '.inputs.modal_token_secret // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$SEC" ]; then ID="$SECRET_ID"; SEC="$SECRET_SECRET"; fi
          if [ -z "$SEC" ]; then echo "::error::no Modal credentials: add the repository secrets or pass the inputs"; exit 1; fi
          echo "::add-mask::$ID"
          echo "::add-mask::$SEC"
          { echo "MODAL_TOKEN_ID=$ID"; echo "MODAL_TOKEN_SECRET=$SEC"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "modal==1.6.3"
      - name: what to do
        id: req
        run: |
          A="${{ github.event.inputs.action }}"
          if [ -z "$A" ]; then A=$(python3 -c "import json; print(json.load(open('deploy/request.json')).get('action', 'deploy'))"); fi
          echo "action=$A" >> "$GITHUB_OUTPUT"
      - name: stop
        if: steps.req.outputs.action == 'stop'
        run: modal app stop verichat
      - name: live Wikipedia lookups from Modal (tiny CPU container)
        if: steps.req.outputs.action == 'wikicheck'
        run: modal run deploy/modal_app.py::wiki_check
      - name: correction rate - deploy without the rate limit
        if: steps.req.outputs.action == 'correction'
        id: cdep
        run: |
          VERICHAT_RATE=0 modal deploy deploy/modal_app.py | tee cdeploy.log
          echo "url=$(grep -o 'https://[^ ]*modal\.run' cdeploy.log | head -1)" >> "$GITHUB_OUTPUT"
      - name: correction rate - 100 TriviaQA questions through the live demo
        if: steps.req.outputs.action == 'correction'
        timeout-minutes: 40
        run: |
          pip install numpy datasets
          python experiments/correction_rate.py --url "${{ steps.cdep.outputs.url }}" --n "${{ github.event.inputs.n || 100 }}" --workers 4 --out correction.json
          cat correction.json
      - name: correction rate - restore the public rate limit
        if: always() && steps.req.outputs.action == 'correction' && steps.cdep.outcome == 'success'
        run: modal deploy deploy/modal_app.py
      - name: recent server logs (no GPU started)
        if: steps.req.outputs.action == 'logs'
        run: modal app logs verichat --since 3h --tail 1000
      - name: fill the model cache on a CPU container (no GPU billed)
        if: steps.req.outputs.action == 'deploy'
        run: modal run deploy/modal_app.py::download
      - name: deploy without the rate limit, for the checks
        if: steps.req.outputs.action == 'deploy'
        id: dep
        run: |
          VERICHAT_RATE=0 modal deploy deploy/modal_app.py | tee deploy.log
          echo "url=$(grep -o 'https://[^ ]*modal\.run' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      - name: smoke test (cold start, chat, stream, long chat, judge, page, metrics)
        if: steps.req.outputs.action == 'deploy'
        run: bash deploy/smoke_test.sh "${{ steps.dep.outputs.url }}"
      - name: short load test (1 then 4 clients)
        if: steps.req.outputs.action == 'deploy'
        run: |
          pip install numpy
          python experiments/load_test.py --url "${{ steps.dep.outputs.url }}" --clients 1,4 --per-client 2 --out load_test.json
          cat load_test.json
      - name: redeploy with the public rate limit (also if a check failed)
        if: always() && steps.req.outputs.action == 'deploy' && steps.dep.outcome == 'success'
        run: |
          modal deploy deploy/modal_app.py
          echo "Demo: ${{ steps.dep.outputs.url }}"
