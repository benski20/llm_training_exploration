[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-training"
version = "0.1.0"
description = "Train small models that can be formally verified: ternary weights, stability losses, MILP proofs, counterexample-guided training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7", "scikit-learn>=1.3"]
sign = ["cryptography>=42"]                  # signed artifacts (vt/artifact.py)
chat = ["tokenizers==0.23.3"]
retrofit = ["tokenizers==0.23.3", "transformers==4.46.3", "peft==0.13.2"]
verichat = ["transformers>=4.46", "accelerate>=0.34"]
verifier = ["transformers>=4.51", "accelerate>=0.34", "scikit-learn>=1.3", "datasets>=2.18"]   # the verification API

[project.scripts]
vt = "vt.cli:main"
vt-verify = "vt.verify_service:main"
vt-verifier-pipeline = "vt.verifier_pipeline:main"
vt-aitext = "vt.aitext:main"

[tool.setuptools]
packages = ["vt"]

[tool.setuptools.package-data]
vt = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
