[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-training"
version = "0.1.0"
description = "Train small models that can be formally verified: ternary weights, stability losses, MILP proofs, counterexample-guided training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]
chat = ["tokenizers==0.23.3"]

[project.scripts]
vt = "vt.cli:main"

[tool.setuptools]
packages = ["vt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
