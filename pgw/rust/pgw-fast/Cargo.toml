[package]
name = "pgw-fast"
version = "0.1.0"
description = "Native hot path of the PGW gateway and service (Python extension `pgw_fast`): fused, zero-copy, GIL-free per-call kernels. Bit-identical to the Python path; the audited reference stays pgw-core-rs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "pgw_fast"
crate-type = ["cdylib", "rlib"]

[dependencies]
pgw-core-rs = { path = "../pgw-core-rs" }
# lane_service.rs: Python bindings of the service trip lane (chat-speed WP-A1).
pgw-lane = { path = "../pgw-lane" }
pyo3 = { version = "0.23", features = ["abi3-py311", "extension-module"] }
numpy = "0.23"
# localgpu.rs: dlopen of the CUDA driver (the gateway's own GPU; builds and runs without CUDA).
libc = "0.2"
# store.rs: ChaCha20 keystream written straight into the numpy output (the key comes from
# pgw_core_rs::prng); same versions as pgw-core-rs, already in Cargo.lock.
chacha20 = "0.9"
zeroize = "1"
# lane.rs: TLS 1.3 on the TCP trip lane (rustls with the `ring` provider: no aws-lc / cmake; PEM parsing
# through rustls' own pki-types, no rustls-pemfile).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# writer.rs (Unix only): AES-256-GCM of the segment writer and of the gateway's chunk open, AWS-LC through
# aws-lc-rs (non-FIPS build, statically linked; VAES + VPCLMULQDQ AVX-512 / AVX2 and AES-NI + PCLMULQDQ code
# picked at run time, ARMv8 AES + PMULL on aarch64): 13 GB/s on one core here against 2.8 GB/s for RustCrypto
# aes-gcm 0.11 (separate CTR and GHASH passes, 128-bit PCLMULQDQ GHASH). The same bytes (tests compare with
# RustCrypto, `cryptography` and a file the RustCrypto build wrote). Key schedule wiped on drop: the
# EVP_AEAD_CTX holding the round keys and the GHASH key table is released by EVP_AEAD_CTX_free ->
# OPENSSL_free, which OPENSSL_cleanse()s the whole allocation (writer.rs module docs and tests).
# aws-lc-sys compiles AWS-LC with the `cc` crate: a C compiler (gcc, clang or zig cc), no cmake, Go, NASM or
# bindgen on Linux / macOS (pregenerated bindings and assembly).
[target.'cfg(unix)'.dependencies]
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }

[dev-dependencies]
# writer.rs tests: RustCrypto AES-GCM, the writer's implementation before 2026-11-26, as an independent
# reference: chunks sealed by either open with the other, byte for byte.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }

[target.'cfg(unix)'.dev-dependencies]
# writer.rs tests of AWS-LC's free path (the aws-lc-sys that aws-lc-rs links: one copy in the build).
aws-lc-sys = "0.47"
