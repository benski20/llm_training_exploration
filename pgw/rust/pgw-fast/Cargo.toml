[package]
name = "pgw-fast"
version = "0.1.0"
description = "Native hot path of the PGW gateway and service (Python extension `pgw_fast`): fused, zero-copy, GIL-free per-call kernels. Bit-identical to the Python path; the audited reference stays pgw-core-rs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "pgw_fast"
crate-type = ["cdylib", "rlib"]

[dependencies]
pgw-core-rs = { path = "../pgw-core-rs" }
# lane_service.rs: Python bindings of the service trip lane (chat-speed WP-A1).
pgw-lane = { path = "../pgw-lane" }
pyo3 = { version = "0.23", features = ["abi3-py312", "extension-module"] }
numpy = "0.23"
# store.rs: ChaCha20 keystream written straight into the numpy output (the key comes from
# pgw_core_rs::prng); same versions as pgw-core-rs, already in Cargo.lock.
chacha20 = "0.9"
zeroize = "1"
# writer.rs: AES-256-GCM of the segment writer (RustCrypto; AES-NI / PCLMULQDQ picked at run time).
# 0.11 (aes 0.9, polyval 0.7) measured 2.5x faster than 0.10 here; `zeroize` wipes the key schedule on drop.
# Note: these pull in crates that need Rust 1.89 (the workspace MSRV); Cargo.lock is format v4,
# which needs cargo >= 1.78.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"] }
# lane.rs: TLS 1.3 on the TCP trip lane (rustls with the `ring` provider: no aws-lc / cmake; PEM parsing
# through rustls' own pki-types, no rustls-pemfile).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
# writer.rs tests: the allocating `Aead::encrypt` as an independent reference.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
