[package]
name = "pgw-fast"
version = "0.1.0"
description = "Native hot path of the PGW gateway and service (Python extension `pgw_fast`): fused, zero-copy, GIL-free per-call kernels. Bit-identical to the Python path; the audited reference stays pgw-core-rs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "pgw_fast"
crate-type = ["cdylib", "rlib"]

[dependencies]
pgw-core-rs = { path = "../pgw-core-rs" }
pyo3 = { version = "0.23", features = ["abi3-py312", "extension-module"] }
numpy = "0.23"
