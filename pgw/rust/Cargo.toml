[workspace]
resolver = "2"
members = ["pgw-core-rs", "pgw-fast", "pgw-lane", "pgw-ntt"]

[workspace.package]
edition = "2021"
rust-version = "1.89"  # AVX-512 intrinsics (pgw-fast lmhead.rs)
license = "Apache-2.0"

[profile.release]
debug = false
overflow-checks = true

[profile.dev]
overflow-checks = true
