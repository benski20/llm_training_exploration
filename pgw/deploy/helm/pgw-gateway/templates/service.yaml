apiVersion: v1
kind: Service
metadata:
  name: {{ include "pgw-gateway.fullname" . }}
  labels:
    {{- include "pgw-gateway.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pgw-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: ops
      port: {{ .Values.opsPort }}
      targetPort: ops
      protocol: TCP
