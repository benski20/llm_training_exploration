{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pgw-gateway.fullname" . }}
  labels:
    {{- include "pgw-gateway.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "pgw-gateway.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: ops         # internal plain-HTTP listener (works with mTLS on the API port)
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scheme: http
{{- end }}
