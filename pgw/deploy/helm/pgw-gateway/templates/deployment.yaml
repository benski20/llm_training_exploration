{{- $secret := include "pgw-gateway.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pgw-gateway.fullname" . }}
  labels:
    {{- include "pgw-gateway.labels" . | nindent 4 }}
spec:
  {{- if gt (int .Values.replicaCount) 1 }}
  {{- fail "replicaCount must be 1: a mask store has exactly one gateway writer (single-use masks)" }}
  {{- end }}
  {{- $drain := int .Values.config.drainTimeoutSeconds }}
  {{- if le (int .Values.terminationGracePeriodSeconds) (add $drain (int .Values.preStopSleepSeconds) 10) }}
  {{- fail "terminationGracePeriodSeconds must exceed preStopSleepSeconds + config.drainTimeoutSeconds + 10 (time to close the mask store after draining)" }}
  {{- end }}
  {{- if and .Values.state.persistence.enabled (not .Values.state.persistence.existingClaim) }}
  {{- $size := toString .Values.state.persistence.size }}
  {{- $bytes := 0 }}
  {{- if hasSuffix "Ti" $size }}{{ $bytes = mul (int (trimSuffix "Ti" $size)) 1099511627776 }}
  {{- else if hasSuffix "Gi" $size }}{{ $bytes = mul (int (trimSuffix "Gi" $size)) 1073741824 }}
  {{- end }}
  {{- $need := add (mul (int64 .Values.maskstore.targetSlots) (int64 .Values.maskstore.bytesPerSlot)) (int64 .Values.maskstore.minFreeBytes) }}
  {{- if and (gt (int64 $bytes) 0) (lt (int64 $bytes) $need) }}
  {{- fail (printf "state.persistence.size %s cannot hold maskstore.targetSlots (%v) x bytesPerSlot (%v) + minFreeBytes: lower targetSlots or enlarge the volume" $size .Values.maskstore.targetSlots .Values.maskstore.bytesPerSlot) }}
  {{- end }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate    # never two pods on one single-use mask store
  selector:
    matchLabels:
      {{- include "pgw-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pgw-gateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/models: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pgw-gateway.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and (not .Values.modelPacks.existingClaim) .Values.modelPacks.image.repository }}
      initContainers:
        - name: copy-packs
          image: {{ printf "%s:%s" .Values.modelPacks.image.repository (default "latest" .Values.modelPacks.image.tag) }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "cp -a {{ .Values.modelPacks.image.path }}/. {{ .Values.modelPacks.mountPath }}/"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: packs
              mountPath: {{ .Values.modelPacks.mountPath }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "pgw-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["pgw", "gateway", "serve"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: ops
              containerPort: {{ .Values.opsPort }}
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.preStopSleepSeconds }}"]
          env:
            - name: PGW_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PGW_LOG_JSON
              value: "true"
            - name: PGW_RENDER
              value: /etc/pgw/models/models.tmpl.json:/run/pgw/models.json
            - name: PGW_GATEWAY_HOST
              value: "0.0.0.0"
            - name: PGW_GATEWAY_PORT
              value: "8080"
            - name: PGW_GATEWAY_MODELS_FILE
              value: /run/pgw/models.json
            - name: PGW_GATEWAY_MASKSTORE_ROOT
              value: {{ printf "%s/masks" .Values.state.mountPath | quote }}
            - name: PGW_GATEWAY_API_KEYS_FILE
              value: {{ printf "%s/api_keys.json" .Values.state.mountPath | quote }}
            - name: PGW_GATEWAY_QUOTA_STATE_FILE
              value: {{ printf "%s/quota.json" .Values.state.mountPath | quote }}
            - name: PGW_GATEWAY_AUDIT_LOG_FILE
              value: {{ printf "%s/audit.jsonl" .Values.state.mountPath | quote }}
            - name: PGW_GATEWAY_REQUIRE_SERVICE_TLS
              value: "true"
            - name: PGW_GATEWAY_REQUESTS_PER_MINUTE
              value: {{ .Values.config.requestsPerMinute | quote }}
            - name: PGW_GATEWAY_TOKENS_PER_MINUTE
              value: {{ .Values.config.tokensPerMinute | quote }}
            - name: PGW_GATEWAY_DEFAULT_MAX_TOKENS
              value: {{ .Values.config.defaultMaxTokens | quote }}
            - name: PGW_GATEWAY_MAX_TOKENS_LIMIT
              value: {{ .Values.config.maxTokensLimit | quote }}
            - name: PGW_GATEWAY_NOISE_MONITOR
              value: {{ .Values.config.noiseMonitor | quote }}
            - name: PGW_GATEWAY_NOISE_MONITOR_FAIL_CLOSED
              value: {{ .Values.config.noiseMonitorFailClosed | quote }}
            - name: PGW_GATEWAY_METRICS_REQUIRE_ADMIN
              value: {{ .Values.config.metricsRequireAdmin | quote }}
            - name: PGW_GATEWAY_DASHBOARD_ENABLED
              value: {{ .Values.config.dashboardEnabled | quote }}
            - name: PGW_GATEWAY_CONSOLE_ENABLED
              value: {{ .Values.console.enabled | quote }}
            {{- if and .Values.console.enabled .Values.console.viewerTokensKey }}
            - name: PGW_GATEWAY_CONSOLE_VIEWER_TOKENS_FILE
              value: /etc/pgw/console/viewer-tokens
            {{- end }}
            - name: PGW_GATEWAY_OPS_PORT
              value: {{ .Values.opsPort | quote }}
            - name: PGW_GATEWAY_DRAIN_TIMEOUT_S
              value: {{ .Values.config.drainTimeoutSeconds | quote }}
            - name: PGW_GATEWAY_MASK_WINDOW_TOKENS
              value: {{ .Values.config.maskWindowTokens | quote }}
            - name: PGW_GATEWAY_MASKSTORE_GC_INTERVAL_S
              value: {{ .Values.maskstore.gcIntervalSeconds | quote }}
            - name: PGW_MASKSTORE_MIN_FREE_BYTES
              value: {{ .Values.maskstore.minFreeBytes | int64 | quote }}
            {{- if .Values.config.integrityCooldownSeconds }}
            - name: PGW_GATEWAY_INTEGRITY_COOLDOWN_S
              value: {{ .Values.config.integrityCooldownSeconds | quote }}
            {{- end }}
            - name: PGW_GATEWAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ .Values.secrets.adminTokenKey }}
            - name: PGW_MASKSTORE_ROOT
              value: {{ printf "%s/masks" .Values.state.mountPath | quote }}
            - name: PGW_MASKSTORE_KEY_PROVIDER
              value: {{ .Values.maskstore.keyProvider | quote }}
            - name: PGW_MASKSTORE_LOW_WATER_SLOTS
              value: {{ .Values.maskstore.lowWaterSlots | quote }}
            - name: PGW_MASKSTORE_TARGET_SLOTS
              value: {{ .Values.maskstore.targetSlots | quote }}
            {{- if eq .Values.maskstore.counter "none" }}
            {{- if not .Values.maskstore.allowNoExternalCounter }}
            {{- fail "maskstore.counter=none needs maskstore.allowNoExternalCounter=true (DEV ONLY): without an external counter a snapshot restore re-serves consumed masks" }}
            {{- end }}
            - name: PGW_MASKSTORE_ALLOW_NO_EXTERNAL_COUNTER
              value: "true"
            {{- else }}
            - name: PGW_MASKSTORE_COUNTER
              value: {{ .Values.maskstore.counter | quote }}
            {{- if eq .Values.maskstore.counter "file" }}
            - name: PGW_MASKSTORE_COUNTER_FILE
              value: {{ printf "%s/generation.counter" .Values.counterVolume.mountPath | quote }}
            {{- end }}
            {{- if eq .Values.maskstore.counter "tpm" }}
            - name: PGW_MASKSTORE_TPM_NV_INDEX
              value: {{ required "maskstore.counterTpmNvIndex is required for counter=tpm" .Values.maskstore.counterTpmNvIndex | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.maskstore.trustedPartnerKeys }}
            - name: PGW_MASKSTORE_TRUSTED_PARTNER_KEYS
              value: {{ toJson .Values.maskstore.trustedPartnerKeys | quote }}
            {{- end }}
            {{- if eq .Values.maskstore.keyProvider "env" }}
            - name: PGW_MASKSTORE_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ .Values.secrets.kekKey }}
            {{- end }}
            {{- if eq .Values.maskstore.keyProvider "kms" }}
            - name: PGW_MASKSTORE_KMS_KEY_URI
              value: {{ required "maskstore.kmsKeyUri is required for keyProvider=kms" .Values.maskstore.kmsKeyUri | quote }}
            {{- if .Values.secrets.kmsMacKey }}
            - name: PGW_MASKSTORE_KMS_MAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ .Values.secrets.kmsMacKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: PGW_GATEWAY_TLS__CERT_FILE
              value: /etc/pgw/tls/tls.crt
            - name: PGW_GATEWAY_TLS__KEY_FILE
              value: /etc/pgw/tls/tls.key
            {{- if .Values.tls.requireClientCert }}
            - name: PGW_GATEWAY_TLS__CA_FILE
              value: /etc/pgw/tls/ca.crt
            - name: PGW_GATEWAY_TLS__REQUIRE_CLIENT_CERT
              value: "true"
            {{- end }}
            {{- end }}
            {{- with .Values.trustedProxyCidrs }}
            - name: PGW_TRUSTED_PROXY_CIDRS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- range $k, $v := .Values.config.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := .Values.maskstore.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # Probes hit the internal plain-HTTP ops listener in every TLS mode (also with mTLS).
          startupProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: packs
              mountPath: {{ .Values.modelPacks.mountPath }}
              readOnly: true
            - name: state
              mountPath: {{ .Values.state.mountPath }}
            {{- if eq .Values.maskstore.counter "file" }}
            - name: counter
              mountPath: {{ .Values.counterVolume.mountPath }}
            {{- end }}
            - name: models
              mountPath: /etc/pgw/models
              readOnly: true
            - name: service-token
              mountPath: /etc/pgw/secrets
              readOnly: true
            - name: run
              mountPath: /run/pgw
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.console.enabled .Values.console.viewerTokensKey }}
            - name: console-viewers
              mountPath: /etc/pgw/console
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/pgw/tls
              readOnly: true
            {{- end }}
            {{- if .Values.serviceClientTls.existingSecret }}
            - name: service-tls
              mountPath: /etc/pgw/service-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: packs
          {{- if .Values.modelPacks.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.modelPacks.existingClaim }}
            readOnly: true
          {{- else if .Values.modelPacks.image.repository }}
          emptyDir: {}
          {{- else }}
          {{- fail "modelPacks.existingClaim or modelPacks.image.repository is required" }}
          {{- end }}
        - name: state
          {{- if .Values.state.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pgw-gateway.stateClaim" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if eq .Values.maskstore.counter "file" }}
        - name: counter
          persistentVolumeClaim:
            claimName: {{ include "pgw-gateway.counterClaim" . }}
        {{- end }}
        - name: models
          configMap:
            name: {{ include "pgw-gateway.fullname" . }}-models
        - name: service-token
          secret:
            secretName: {{ $secret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.secrets.serviceTokenKey }}
                path: {{ .Values.secrets.serviceTokenKey }}
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- if and .Values.console.enabled .Values.console.viewerTokensKey }}
        - name: console-viewers
          secret:
            secretName: {{ $secret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.console.viewerTokensKey }}
                path: viewer-tokens
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ required "tls.existingSecret is required when tls.enabled" .Values.tls.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.serviceClientTls.existingSecret }}
        - name: service-tls
          secret:
            secretName: {{ .Values.serviceClientTls.existingSecret }}
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
