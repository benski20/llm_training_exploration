# Default values for pgw-gateway. Secrets are NEVER put in values: reference existing Secrets.

image:
  repository: registry.example.com/pgw/pgw-gateway
  tag: ""                 # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Each replica owns its mask store (masks are single use), so the gateway runs as a single
# replica with a Recreate strategy. Scale out with one release (and one store) per replica.
replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}         # e.g. IRSA / workload identity for the KMS key provider

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
# Shutdown sequence on SIGTERM: preStop sleep (endpoints are removed from the Service), then the
# gateway turns /readyz 503, refuses new work and waits up to config.drainTimeoutSeconds for open
# requests and streams, then burns leftover reservations and closes the store. Must exceed
# preStopSleepSeconds + config.drainTimeoutSeconds + ~15 s (the chart refuses smaller values).
terminationGracePeriodSeconds: 75
preStopSleepSeconds: 5

# Internal plain-HTTP listener for probes and Prometheus (/healthz, /readyz, /metrics only). Probes
# use it in every TLS mode, so readiness is checked even when the API requires client certificates.
opsPort: 9091

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    memory: 8Gi

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pgw.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Non-secret gateway settings (PGW_GATEWAY_*). See `pgw config show gateway`.
config:
  logLevel: INFO
  requestsPerMinute: 600
  tokensPerMinute: 200000
  defaultMaxTokens: 512
  maxTokensLimit: 8192
  noiseMonitor: true
  noiseMonitorFailClosed: true
  integrityCooldownSeconds: ""   # empty (recommended) = circuit breaker reset by admin only
  metricsRequireAdmin: false     # NetworkPolicy limits /metrics to the monitoring namespace
  dashboardEnabled: true
  drainTimeoutSeconds: 30
  # Masks are reserved for the prompt plus this many tokens and extended while generating, so an
  # early stop or disconnect burns at most one window (0 = reserve prompt + max_tokens up front).
  maskWindowTokens: 64
  # Additional PGW_* environment variables (non-secret).
  extraEnv: {}

# Served models. The compute-service token is read from secrets.existingSecret at start-up and
# substituted into the rendered models file (tmpfs, mode 0600); it never appears in a ConfigMap.
models:
  - name: llama3-8b
    packDir: llama3-8b                  # directory under modelPacks.mountPath
    fingerprint: ""                     # REQUIRED: the 64-hex pack fingerprint (`pgw inspect`)
    ring: K32A12C27
    serviceUrl: https://compute.pgw.example.net:8443
    maxConcurrentSessions: 32
    serviceTimeoutSeconds: 60

# Model packs (gateway needs plain.safetensors + tokenizer). Mounted read-only.
modelPacks:
  mountPath: /var/lib/pgw/packs
  existingClaim: ""                     # PVC with pack directories (populated with `pgw pack`)
  # Alternative: an OCI image whose /packs directory contains the packs (copied by an init container).
  image:
    repository: ""
    tag: ""
    path: /packs

# Encrypted single-use mask store + gateway state (API keys, quota state, audit log).
state:
  mountPath: /var/lib/pgw/state
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    # ReadWriteOnce only. Never put the mask store on NFS/CephFS/RWX storage shared between nodes:
    # SQLite WAL and flock are unreliable there and a lost cursor update re-serves masks (the store
    # refuses to open on a network filesystem). A pgw-factory on another node uses output=export and
    # its segments are imported with `pgw maskstore import`.
    accessModes: [ReadWriteOnce]
    # Must hold maskstore.targetSlots x maskstore.bytesPerSlot plus maskstore.minFreeBytes headroom
    # (the chart fails otherwise): 16384 slots x 6.9 MB (8B at K40) = 113 GB.
    size: 200Gi
    annotations: {}

maskstore:
  # env: KEK from secrets.existingSecret[kekKey] (base64, 32 bytes) | kms | pkcs11
  keyProvider: env
  kmsKeyUri: ""                       # keyProvider=kms, e.g. aws-kms://arn:aws:kms:...
  lowWaterSlots: 4096
  targetSlots: 16384
  # Stored W r bytes per token slot of the served model (`pgw factory status` prints it):
  # 8B at K40 ~ 6.9 MB, 0.5B ~ 1.5 MB. Used to check that targetSlots fits the state volume.
  bytesPerSlot: 6900000
  # Segments are refused (factory stops) unless this much stays free on the state volume; the
  # gateway's state.sqlite, journal, quota and audit files live there too.
  minFreeBytes: 10737418240
  # Mask store GC (dead leases of crashed pods, consumed segments, old audit rows), seconds.
  gcIntervalSeconds: 600
  # External monotonic counter (rollback protection, SPEC 7.6). The gateway refuses to hand out
  # masks without one: restoring a snapshot of the state volume (VolumeSnapshot, Velero, disk image)
  # would otherwise re-serve consumed masks.
  #   file     - counter file on its OWN volume (counterVolume below), excluded from backups
  #   provider - the KMS/HSM key provider's counter
  #   tpm      - TPM NV counter (counterTpmNvIndex; node must expose /dev/tpmrm0)
  #   none     - DEV ONLY, needs allowNoExternalCounter: true
  counter: file
  counterTpmNvIndex: ""
  allowNoExternalCounter: false
  # Partner factories: Ed25519 public keys whose signed segments may be imported (required for
  # `pgw maskstore import` of partner segments; unsigned segments are refused).
  trustedPartnerKeys: []
  extraEnv: {}

# Volume of the file counter (maskstore.counter=file). Separate from the state volume on purpose:
# a restore of the state volume must not roll it back. Exclude it from snapshots and backups
# (the PVC carries velero.io/exclude-from-backup). If you ever restore the state volume, burn every
# ACTIVE segment and rebind witnesses (`pgw maskstore` runbook) before serving again.
counterVolume:
  mountPath: /var/lib/pgw/counter
  existingClaim: ""
  storageClass: ""
  size: 1Gi
  annotations: {}

# Existing Secret (create it with kubectl / External Secrets / Vault; never in values).
secrets:
  existingSecret: ""                  # REQUIRED
  adminTokenKey: admin-token          # PGW_GATEWAY_ADMIN_TOKEN
  kekKey: kek                         # base64 KEK for maskstore.keyProvider=env
  serviceTokenKey: service-token      # bearer token for the compute service (tenant credential)
  kmsMacKey: ""                       # optional key name: base64 HMAC key for the journal with kms

# TLS for the gateway's own listener (secret with tls.crt / tls.key, optional ca.crt for mTLS).
tls:
  enabled: false
  existingSecret: ""
  requireClientCert: false

# Client TLS towards the compute service: CA to verify it and the gateway's mTLS client certificate
# (secret with ca.crt, tls.crt, tls.key).
serviceClientTls:
  existingSecret: ""

networkPolicy:
  enabled: true
  # Who may call the gateway API (NetworkPolicyPeer list). Default: pods in the same namespace.
  ingressFrom:
    - podSelector: {}
  # Prometheus scraping (namespaceSelector labels of the monitoring namespace).
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  egress:
    # The ONLY destination the gateway may reach: the PGW compute service.
    computeService:
      cidrs: []                       # e.g. PrivateLink / PSC endpoint IPs, or the service's public range
      ports: [443, 8443]
      # In-cluster compute service (development clusters): selectors of its pods.
      podSelector: {}
      namespaceSelector: {}
    dns:
      enabled: true
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
    # Extra peers, e.g. the KMS endpoint for maskstore.keyProvider=kms (NetworkPolicyEgressRule list).
    extraRules: []

podDisruptionBudget:
  enabled: false
  maxUnavailable: 0

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
