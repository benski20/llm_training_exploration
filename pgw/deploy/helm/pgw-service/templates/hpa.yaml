{{- if .Values.autoscaling.enabled }}
{{- $custom := .Values.autoscaling.customMetric.name }}
{{- if and .Values.gpu.enabled (not $custom) }}
{{- fail "autoscaling.enabled with gpu.enabled needs autoscaling.customMetric.name (e.g. pgw_service_inflight via prometheus-adapter): CPU utilization stays low while the GPU queue saturates" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "pgw-service.fullname" . }}
  labels:
    {{- include "pgw-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "pgw-service.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if $custom }}
    - type: Pods
      pods:
        metric:
          name: {{ $custom }}
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.customMetric.targetAverageValue | quote }}
    {{- else }}
    # CPU-image deployments only (gpu.enabled=false)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
