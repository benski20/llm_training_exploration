{{- if .Values.networkPolicy.enabled }}
{{- if empty .Values.networkPolicy.computeFrom }}
{{- fail "networkPolicy.computeFrom must list the allowed gateway peers (an empty list admits every source)" }}
{{- end }}
# Ingress: the compute port from customer gateways only, metrics from monitoring only.
# Egress: none. The service is stateless and needs no outbound connections, so a compromised
# replica cannot exfiltrate anything over the network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgw-service.fullname" . }}
  labels:
    {{- include "pgw-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pgw-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.computeFrom | nindent 8 }}
      ports:
        - port: compute
          protocol: TCP
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
  {{- if not (or .Values.networkPolicy.egress.dns.enabled .Values.networkPolicy.egress.extraRules) }}
  egress: []
  {{- else }}
  egress:
    {{- if .Values.networkPolicy.egress.dns.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.dns.podLabels | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
