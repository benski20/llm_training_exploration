{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled .Values.alerts.enabled }}
{{- /* Same rules as deploy/monitoring/pgw-alerts.yml (group pgw-factory). */}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "pgw-factory.fullname" . }}
  labels:
    {{- include "pgw-factory.labels" . | nindent 4 }}
    {{- with .Values.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: pgw-factory
      rules:
        - alert: PGWFactoryStalled
          expr: time() - max by (namespace, job) (pgw_factory_last_success_timestamp) > {{ int .Values.alerts.factoryStallSeconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: {{ printf "PGW mask factory made no progress for over %v s" (int .Values.alerts.factoryStallSeconds) | quote }}
            description: "No scheduler plan or segment completed. Check pgw factory status and the factory logs."
        - alert: PGWFactoryNotRefilling
          expr: max by (fingerprint, ring) (pgw_masks_low_water) == 1 unless on (fingerprint, ring) (sum by (fingerprint, ring) (increase(pgw_factory_slots_generated_total[1h])) > 0)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PGW store below low water and no new masks"
            description: "Check the disk budget (disk_limited in pgw factory status), the encrypted-mask link and the factory errors."
        - alert: PGWFactoryErrors
          expr: sum by (namespace, job) (increase(pgw_factory_errors_total[30m])) > 2
          labels:
            severity: warning
          annotations:
            summary: "PGW mask factory runs are failing"
            description: "Several failed factory runs in 30 m. The factory backs off; see its logs."
        - alert: PGWFactoryProviderIntegrityFailure
          expr: sum by (namespace, job) (increase(pgw_factory_provider_integrity_failures_total[1h])) > 0
          labels:
            severity: page
          annotations:
            summary: "PGW encrypted mask factory: the compute provider returned wrong products"
            description: "A segment's provider products failed the factory's private self-check (or a reply was malformed). An honest provider never causes this. The factory halts after max_provider_integrity_failures (default 3). Treat as a security incident."
        - alert: PGWFactoryHalted
          expr: max by (namespace, job) (pgw_factory_halted) == 1
          labels:
            severity: page
          annotations:
            summary: "PGW mask factory halted after provider integrity failures"
            description: "No masks are produced until an operator investigates the provider and runs pgw factory clear-halt."
{{- end }}
