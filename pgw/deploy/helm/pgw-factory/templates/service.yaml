{{- if .Values.metrics.enabled }}
# Metrics-only Service (the factory has no API).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pgw-factory.fullname" . }}-metrics
  labels:
    {{- include "pgw-factory.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pgw-factory.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
