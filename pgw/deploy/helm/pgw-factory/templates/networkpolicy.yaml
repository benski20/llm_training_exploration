{{- if .Values.networkPolicy.enabled }}
# The factory accepts no connections and, by default, opens none (deny-all egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgw-factory.fullname" . }}
  labels:
    {{- include "pgw-factory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pgw-factory.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  {{- if not (or .Values.networkPolicy.egress.dns.enabled .Values.networkPolicy.egress.extraRules) }}
  egress: []
  {{- else }}
  egress:
    {{- if .Values.networkPolicy.egress.dns.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.dns.podLabels | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
