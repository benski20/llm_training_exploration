# Default values for pgw-factory. Secrets are NEVER put in values: reference existing Secrets.

image:
  repository: registry.example.com/pgw/pgw-factory       # use .../pgw-factory-cuda with gpu.enabled
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 120   # the current segment is aborted cleanly on SIGTERM

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    memory: 16Gi

gpu:
  enabled: false
  count: 1
  resourceName: nvidia.com/gpu

# store: write into a local encrypted mask store (customer-run factory)
# export: write HPKE-sealed segment files for a customer (independent partner factory)
output: store

# Model packs (the factory needs only the linears shards). Mounted read-only.
modelPacks:
  mountPath: /var/lib/pgw/packs
  existingClaim: ""            # REQUIRED
  packDirs: [llama3-8b]        # first = PGW_FACTORY_PACK_PATH, the rest = extra packs kept topped up

# Mask store (output=store): the gateway's state volume (pgw-gateway chart, `<release>-state`).
store:
  existingClaim: ""            # REQUIRED for output=store
  mountPath: /var/lib/pgw/state
  # The store is shared with the gateway pod, so the factory MUST run on the gateway's node (same
  # kernel: SQLite WAL + flock work). Never share a store across nodes via RWX/NFS; a factory on
  # other hardware uses output=export and the gateway imports its segments.
  colocateWithGateway:
    enabled: true
    gatewayRelease: ""         # pgw-gateway release name (instance label); empty = any gateway
  keyProvider: env             # env (secrets.kekKey) | kms | pkcs11
  kmsKeyUri: ""

# Export (output=export): partner mode.
export:
  existingClaim: ""            # REQUIRED for output=export
  mountPath: /var/lib/pgw/export
  # ConfigMap holding the customer's X25519 public key (not secret).
  recipientPublicKey:
    configMap: ""
    key: recipient.pub

config:
  logLevel: INFO
  rings: [K32A12C27]
  segmentSlots: 4096
  chunkSlots: 256
  checks: 2
  # Keep consistent with the gateway chart (maskstore.lowWaterSlots/targetSlots) and the volume:
  # 16384 slots x 6.9 MB (8B at K40) = 113 GB on the gateway's 200Gi state volume.
  lowWaterSlots: 4096
  targetSlots: 16384
  # Slots per encrypted chunk in segment files: unset = sized to ~segmentChunkBytes for the widest
  # linear (bounds the decrypted masks each gateway session caches).
  segmentChunkBytes: 1048576
  # Disk guards: never produce a segment that would leave less than minFreeBytes free on the target
  # volume (the gateway's state.sqlite lives there); maxStoreBytes caps segment bytes (0 = off).
  minFreeBytes: 10737418240
  maxStoreBytes: 0
  maxSlotsPerHour: 0           # 0 = unlimited
  dutyCycle: 1.0
  nice: 10                     # low CPU priority next to the gateway
  cpuThreads: 0
  pollIntervalSeconds: 30
  factoryId: ""                # recorded in segment headers; default = release name
  extraEnv: {}

# Internal /metrics + /healthz listener (liveness: recent scheduler progress, no failure streak).
metrics:
  enabled: true
  port: 9100
  healthMaxStaleSeconds: 3600   # liveness fails when no plan/segment completed for this long
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # Prometheus scraping peers (namespaceSelector of the monitoring namespace).
  from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring

secrets:
  existingSecret: ""           # REQUIRED for output=store with keyProvider=env
  kekKey: kek                  # the SAME KEK as the gateway's store
  kmsMacKey: ""

networkPolicy:
  enabled: true
  # The factory needs no network at all. Add rules only for a KMS / HSM endpoint.
  egress:
    dns:
      enabled: false
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
    extraRules: []
