# PGW provider images -> GHCR, on a release tag (or by hand).
#
#   ghcr.io/<owner>/pgw-provider:<tag>       deploy/docker/provider.Dockerfile      (CUDA; RunPod GPU pods)
#   ghcr.io/<owner>/pgw-provider-cpu:<tag>   deploy/docker/provider-cpu.Dockerfile  (CPU; tests, client test pod)
#
# GitHub reads workflows only from the repository root's .github/workflows: while PGW lives in the `pgw/`
# subdirectory, copy this file there (PGW_DIR points the jobs at the project; "." once PGW is its own repository).
# Push a tag like `pgw-provider-v0.2.0`; then `PGW_RUNPOD_IMAGE=ghcr.io/<owner>/pgw-provider:pgw-provider-v0.2.0`.
# Both images are smoke-tested before any push (CLI, native extension, root dropped); the CPU image also runs the
# service with SDK keys (deploy/docker/provider-smoke.sh: enroll auth, forged and revoked keys refused).
name: pgw-provider-image

on:
  push:
    tags: ["pgw-provider-v*"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PGW_DIR: pgw

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write        # push to GHCR with the workflow's own token
      id-token: write        # build provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pgw-provider-cpu
            dockerfile: provider-cpu.Dockerfile
          - image: pgw-provider
            dockerfile: provider.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: free disk space (CUDA wheels are large)
        if: matrix.image == 'pgw-provider'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: image name (GHCR needs lowercase)
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        id: meta
        with:
          images: ${{ steps.name.outputs.ref }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - name: build (local, for the smoke test)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ${{ env.PGW_DIR }}
          file: ${{ env.PGW_DIR }}/deploy/docker/${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: smoke test
        env:
          IMAGE: ${{ matrix.image }}:ci
        run: |
          docker run --rm "$IMAGE" pgw service --help > /dev/null
          docker run --rm "$IMAGE" python -c "from pgw.core import native; assert native.fast is not None"
          docker run --rm "$IMAGE" id -u | grep -qx 10001   # the entrypoint drops root
          docker run --rm --entrypoint pgw-runpod-boot -e RUNPOD_PUBLIC_IP= "$IMAGE" || test $? -eq 2
      - name: SDK-key service smoke test (CPU image)
        if: matrix.image == 'pgw-provider-cpu'
        run: bash ${{ env.PGW_DIR }}/deploy/docker/provider-smoke.sh ${{ matrix.image }}:ci
      - name: log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ${{ env.PGW_DIR }}
          file: ${{ env.PGW_DIR }}/deploy/docker/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-name: ${{ steps.name.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
